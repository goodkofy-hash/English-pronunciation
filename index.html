<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>영국 영어 학습장</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef7fb;margin:0;padding:16px;color:#243447}.app{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}.title{font-size:22px;font-weight:800}button{cursor:pointer}.tab,.back{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:#edf2f7;color:#415466}.tab.on{background:#2d7ff9;color:white}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(38,74,100,.1)}.hidden{display:none!important}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #edf0f2}.info{display:flex;flex-direction:column;gap:4px}.en{font-size:18px;font-weight:800}.ko{font-size:12px;color:#64727e;background:#eef3f6;padding:3px 6px;border-radius:5px;margin-left:5px}.mean{font-size:14px;color:#27965a}.new{font-size:11px;background:#fff3c4;color:#7b5b00;padding:3px 6px;border-radius:999px;margin-left:5px}.play{background:#2c70b4;color:white;border:0;border-radius:8px;padding:9px 12px;font-weight:800}.gameBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.gameBtn{border:0;border-radius:12px;padding:13px 18px;color:white;font-size:16px;font-weight:900}.all{background:#22a06b}.week{background:#8b5cf6}.ghead{display:flex;justify-content:space-between;align-items:center}.score{font-size:14px;color:#6f7d8c}.gtitle{text-align:center;font-size:21px;font-weight:900;margin-top:8px}.inst{text-align:center;color:#6f7d8c;font-size:14px;margin:8px 0 12px}.listen{display:block;margin:0 auto 16px;border:0;border-radius:12px;background:#2d7ff9;color:white;padding:13px 22px;font-size:17px;font-weight:900}.answer,.tiles{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.answer{margin:18px 0}.box{width:40px;height:48px;border:2px solid #dce8f2;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:900}.box.filled{background:#f0f8ff;border-color:#82beff}.hyphen{display:flex;align-items:center;font-size:24px;font-weight:900}.tiles{margin:18px 0}.tile{min-width:46px;height:46px;border:0;border-radius:11px;background:#eef7ff;box-shadow:0 3px 8px rgba(0,0,0,.1);font-size:21px;font-weight:900}.tile.used{visibility:hidden}.hint{display:block;margin:10px auto;border:0;border-radius:9px;background:#fff5d7;padding:9px 14px;font-weight:800}.hinttext,.msg,.reveal{text-align:center}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.controls button{border:0;border-radius:10px;padding:10px 13px;font-weight:800}.primary{background:#4c6982;color:white}.next{background:#22a06b;color:white;display:none}.msg{min-height:28px;margin-top:12px;font-weight:900}.ok{color:#22a06b}.bad{color:#e5484d}.reveal{display:none;margin-top:8px}.reveal .word{font-size:24px;font-weight:900;color:#2d7ff9}
</style></head><body><div class="app">
<div class="top"><div class="title">🇬🇧 영국 영어 학습장</div><div><button id="tabAll" class="tab on" onclick="showList('all')">전체 단어</button><button id="tabWeek" class="tab" onclick="showList('week')">이번 주 단어</button></div></div>
<section id="listSec" class="card"><h3 id="listTitle">전체 단어</h3><div id="list"></div><div class="gameBtns"><button class="gameBtn all" onclick="openGame('all')">🎮 전체 단어 게임</button><button class="gameBtn week" onclick="openGame('week')">🆕 이번 주 단어만 게임</button></div></section>
<section id="gameSec" class="card hidden"><div class="ghead"><button class="back" onclick="showList(lastMode)">← 단어장</button><div class="score" id="score"></div></div><div class="gtitle" id="gameTitle"></div><div class="inst">발음을 듣고 알파벳을 골라 단어를 완성하세요.</div><button class="listen" onclick="playCurrent()">🔊 다시 듣기</button><div id="answer" class="answer"></div><div id="tiles" class="tiles"></div><button class="hint" onclick="showHint()">💡 뜻 힌트</button><div id="hintText" class="hinttext"></div><div class="controls"><button onclick="undo()">↩ 한 글자 지우기</button><button onclick="resetWord()">다시</button><button class="primary" onclick="checkAnswer()">정답 확인</button><button id="nextBtn" class="next" onclick="nextWord()">다음 단어 →</button></div><div id="msg" class="msg"></div><div id="reveal" class="reveal"><div id="wordReveal" class="word"></div><div id="meanReveal"></div></div></section>
</div><script>
const google="https://ssl.gstatic.com/dictionary/static/sounds/20200429/",youdao="https://dict.youdao.com/dictvoice?type=1&audio=",ateAudio="https://dict.youdao.com/dictvoice?type=2&audio=ate",alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ";const words=[{"en": "actually", "ko": "액추얼리", "mean": "실제로, 사실은", "src": "alt"}, {"en": "aggravation", "ko": "애그러베이션", "mean": "악화, 짜증나는 일", "file": "aggravation--_gb_1.mp3"}, {"en": "anchor", "ko": "앵커", "mean": "닻, 정신적 지주", "file": "anchor--_gb_1.mp3"}, {"en": "appear", "ko": "어피어", "mean": "나타나다, ~처럼 보이다", "file": "appear--_gb_1.mp3"}, {"en": "beautician", "ko": "뷰티션", "mean": "미용사", "file": "beautician--_gb_1.mp3"}, {"en": "admitting", "ko": "어드미팅", "mean": "인정하는", "src": "alt"}, {"en": "ambitious", "ko": "앰비셔스", "mean": "야심 있는", "file": "ambitious--_gb_1.mp3"}, {"en": "answer", "ko": "앤서", "mean": "대답, 대답하다", "file": "answer--_gb_1.mp3"}, {"en": "architect", "ko": "아키텍트", "mean": "건축가, 설계자", "file": "architect--_gb_1.mp3"}, {"en": "adolescent", "ko": "애덜레슨트", "mean": "청소년, 사춘기의", "file": "adolescent--_gb_1.mp3"}, {"en": "ambitiously", "ko": "앰비셔슬리", "mean": "야심 차게", "file": "ambitiously--_gb_1.mp3"}, {"en": "anti-clockwise", "ko": "앤티 클락와이즈", "mean": "시계 반대 방향으로", "src": "alt"}, {"en": "ate", "ko": "에이트", "mean": "먹었다 (eat의 과거형)", "src": "ate"}, {"en": "beige", "ko": "베이쥬", "mean": "베이지색", "file": "beige--_gb_1.mp3"}, {"en": "blankly", "ko": "블랭클리", "mean": "멍하니", "file": "blankly--_gb_1.mp3"}, {"en": "boisterous", "ko": "보이스터러스", "mean": "활기차고 시끄러운", "src": "alt"}, {"en": "business", "ko": "비즈니스", "mean": "사업, 업무", "src": "alt"}, {"en": "bounce", "ko": "바운스", "mean": "튀다, 튀어 오르다", "src": "alt"}, {"en": "bound", "ko": "바운드", "mean": "껑충 뛰다; ~행인", "src": "alt"}, {"en": "breath", "ko": "브레스", "mean": "숨, 호흡", "src": "alt"}, {"en": "carousel", "ko": "캐러셀", "mean": "회전목마", "src": "alt"}, {"en": "catalogue", "ko": "캐털로그", "mean": "목록, 카탈로그", "src": "alt"}, {"en": "caught", "ko": "코트", "mean": "잡았다 (catch의 과거형)", "src": "alt"}, {"en": "centre", "ko": "센터", "mean": "중앙, 중심", "src": "alt"}, {"en": "certain", "ko": "서튼", "mean": "확실한, 어떤", "src": "alt"}, {"en": "champagne", "ko": "샴페인", "mean": "샴페인", "src": "alt"}, {"en": "charade", "ko": "셔라드", "mean": "몸짓으로 맞히는 게임; 가식", "src": "alt"}, {"en": "chemical", "ko": "케미컬", "mean": "화학의; 화학 물질", "src": "alt"}, {"en": "chilly", "ko": "칠리", "mean": "쌀쌀한", "src": "alt"}, {"en": "chrome", "ko": "크롬", "mean": "크롬; 반짝이는 금속 도금", "src": "alt", "week": true}, {"en": "cloud", "ko": "클라우드", "mean": "구름", "src": "alt", "week": true}, {"en": "colleague", "ko": "콜리그", "mean": "동료", "src": "alt", "week": true}, {"en": "committed", "ko": "커미티드", "mean": "헌신적인; 전념한", "src": "alt", "week": true}, {"en": "comprehension", "ko": "컴프리헨션", "mean": "이해, 이해력", "src": "alt", "week": true}, {"en": "confusion", "ko": "컨퓨전", "mean": "혼란, 혼동", "src": "alt", "week": true}, {"en": "consider", "ko": "컨시더", "mean": "고려하다, 생각하다", "src": "alt", "week": true}, {"en": "cooperation", "ko": "코오퍼레이션", "mean": "협력, 협동", "src": "alt", "week": true}, {"en": "corrosion", "ko": "커로전", "mean": "부식, 부식 작용", "src": "alt", "week": true}, {"en": "courteous", "ko": "커티어스", "mean": "예의 바른, 정중한", "src": "alt", "week": true}, {"en": "crazily", "ko": "크레이지리", "mean": "미친 듯이, 터무니없이", "src": "alt", "week": true}, {"en": "critique", "ko": "크리티크", "mean": "비평, 비평하다", "src": "alt", "week": true}, {"en": "decide", "ko": "디사이드", "mean": "결정하다", "src": "alt", "week": true}, {"en": "decision", "ko": "디시전", "mean": "결정, 판단", "src": "alt", "week": true}, {"en": "decoration", "ko": "데커레이션", "mean": "장식, 장식물", "src": "alt", "week": true}];
let audio=null,lastMode="all",pool=[],order=[],pos=0,correct=0,chosen=[],tiles=[];
function url(w){return w.src==="ate"?ateAudio:w.src==="alt"?youdao+encodeURIComponent(w.en):google+w.file}
function playAudio(w){if(audio){audio.pause();audio.currentTime=0}audio=new Audio(url(w));audio.play().catch(()=>{})}
function getPool(m){return m==="week"?words.filter(w=>w.week):words}
function showList(m){lastMode=m;document.getElementById("listSec").classList.remove("hidden");document.getElementById("gameSec").classList.add("hidden");document.getElementById("tabAll").classList.toggle("on",m==="all");document.getElementById("tabWeek").classList.toggle("on",m==="week");document.getElementById("listTitle").textContent=m==="week"?"이번 주 단어 · 19/10 & 2/11":"전체 단어";const box=document.getElementById("list");box.innerHTML="";getPool(m).forEach((w,i)=>{const actual=words.indexOf(w),r=document.createElement("div");r.className="row";r.innerHTML='<div class="info"><div><span class="en">'+(i+1)+'. '+w.en+'</span>'+(w.week?'<span class="new">NEW</span>':'')+'<span class="ko">'+w.ko+'</span></div><div class="mean">'+w.mean+'</div></div><button class="play" onclick="playAudio(words['+actual+'])">🔊 UK 발음</button>';box.appendChild(r)})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function openGame(m){lastMode=m;pool=getPool(m);order=shuffle([...Array(pool.length).keys()]);pos=0;correct=0;document.getElementById("listSec").classList.add("hidden");document.getElementById("gameSec").classList.remove("hidden");document.getElementById("gameTitle").textContent=m==="week"?"🆕 이번 주 단어 게임":"🎮 전체 단어 게임";renderGame();playCurrent()}
function current(){return pool[order[pos]]}
function makeTiles(){const ls=current().en.replace(/-/g,"").toUpperCase().split("");const extra=Math.max(5,Math.ceil(ls.length*.5));for(let i=0;i<extra;i++)ls.push(alphabet[Math.floor(Math.random()*26)]);return shuffle(ls.map((ch,i)=>({ch,used:false,id:i})))}
function renderGame(){chosen=[];tiles=makeTiles();document.getElementById("hintText").textContent="";document.getElementById("msg").textContent="";document.getElementById("reveal").style.display="none";document.getElementById("nextBtn").style.display="none";renderAnswer();renderTiles();score()}
function renderAnswer(){const a=document.getElementById("answer");a.innerHTML="";let ci=0;for(const ch of current().en.toUpperCase()){if(ch==="-"){const d=document.createElement("div");d.className="hyphen";d.textContent="-";a.appendChild(d)}else{const d=document.createElement("div");d.className="box"+(chosen[ci]?" filled":"");d.textContent=chosen[ci]?chosen[ci].ch:"";a.appendChild(d);ci++}}}
function renderTiles(){const t=document.getElementById("tiles");t.innerHTML="";tiles.forEach(x=>{const b=document.createElement("button");b.className="tile"+(x.used?" used":"");b.textContent=x.ch;b.onclick=()=>{if(x.used)return;const n=current().en.replace(/-/g,"").length;if(chosen.length>=n)return;x.used=true;chosen.push(x);renderAnswer();renderTiles()};t.appendChild(b)})}
function undo(){const x=chosen.pop();if(x){x.used=false;renderAnswer();renderTiles()}}
function resetWord(){tiles.forEach(x=>x.used=false);chosen=[];renderAnswer();renderTiles();document.getElementById("msg").textContent=""}
function showHint(){document.getElementById("hintText").textContent=current().mean}
function checkAnswer(){const target=current().en.replace(/-/g,"").toUpperCase(),guess=chosen.map(x=>x.ch).join("");const m=document.getElementById("msg");if(guess.length!==target.length){m.textContent="아직 글자를 모두 고르지 않았어요.";m.className="msg bad";return}if(guess===target){correct++;m.textContent="정답! 🎉";m.className="msg ok";document.getElementById("wordReveal").textContent=current().en;document.getElementById("meanReveal").textContent=current().mean;document.getElementById("reveal").style.display="block";document.getElementById("nextBtn").style.display="inline-block";score()}else{m.textContent="아쉬워요. 다시 들어보고 도전해보세요!";m.className="msg bad"}}
function nextWord(){pos=(pos+1)%order.length;if(pos===0)order=shuffle([...Array(pool.length).keys()]);renderGame();playCurrent()}
function playCurrent(){playAudio(current())}
function score(){document.getElementById("score").textContent="정답 "+correct+" / "+pool.length}
showList("all");
</script></body></html>
